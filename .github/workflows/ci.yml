name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Compilar web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  ansible:
    name: Validar Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los secretos solo se suben cifrados
        run: |
          for f in $(git ls-files '*vault*.yml'); do
            head -1 "$f" | grep -q '^\$ANSIBLE_VAULT;' || { echo "::error file=$f::$f no está cifrado con ansible-vault"; exit 1; }
          done
      - run: pip install ansible-core ansible-lint
      - run: ansible-playbook playbooks/site.yml --syntax-check
      - run: ansible-playbook playbooks/pb-env-local.yml --syntax-check
      - run: ansible-lint playbooks/
